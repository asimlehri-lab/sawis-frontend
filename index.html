<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable as a phone/desktop app (Add to Home Screen). The manifest
         and icons live in /public; the install button is src/InstallApp.tsx.
         App.tsx keeps theme-color in step with the light/dark theme. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SAWIS" />
    <title>SAWIS</title>
    <!-- Applies a saved dark-theme choice before the app renders, so a
         returning user who picked dark doesn't see a flash of the light
         theme first. Mirrors App.tsx's THEME_KEY effect -- keep both in
         sync if that key or default ever changes. Defaults to light and
         does nothing for anyone who hasn't explicitly chosen dark. -->
    <script>
      try {
        if (localStorage.getItem("sawis_theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
